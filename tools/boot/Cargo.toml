[package]
name = "boot"
version = "0.2.3"
edition = "2024"
license = "GPL-2.0-only"

[build-dependencies]
# Vendored, patched for a 1920x1080 framebuffer on both firmware paths: by
# path, as boot-test takes it.
bootloader = { path = "../../vendor/bootloader" }
simplos = { path = "../../kernel", artifact = "bin", target = "x86_64-unknown-none" }
# The user program the kernel runs from the ramdisk: ordinary Rust with std,
# built for Linux, whose system calls simplos implements.
probe = { path = "../../user/probe", artifact = "bin", target = "x86_64-unknown-linux-musl" }
[dependencies]
# used for UEFI booting in QEMU
ovmf-prebuilt = "0.1.0-alpha.1"
