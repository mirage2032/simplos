[package]
name = "boot-test"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[dependencies]
# The same vendored bootloader the real images use, so a test boots the way the
# kernel does: by path, as boot takes it.
bootloader = { path = "../../vendor/bootloader" }
# Attached to every test boot as the ramdisk, as boot does for the real
# images, so tests can run it.
probe = { path = "../../user/probe", artifact = "bin", target = "x86_64-unknown-linux-musl" }
# UEFI firmware for QEMU, the same crate and version boot uses.
ovmf-prebuilt = "0.1.0-alpha.1"
