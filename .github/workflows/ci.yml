name: CI

# Every pull request into develop, and every promotion to master (promote.yml
# calls this workflow for the commit it is about to release).
#
# One job, not several: the expensive part by far is the vendored bootloader,
# which builds four real-mode BIOS stages and a UEFI loader through five nested
# `cargo install` runs with their own `build-std`. Splitting format, lint, test
# and build across jobs would pay that cost once per job.
#
# Deliberately without a `paths` filter, even though a README-only change pays
# for a full build. Once this is a required check on develop, a pull request
# whose files are all excluded would never run it, and a required check that
# never runs stays pending forever — the pull request can't merge and there is
# nothing to re-run. Minutes are cheaper than that.
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to check (defaults to the calling run's commit)
        type: string
        required: false

permissions:
  contents: read

# One run per PR: a new push cancels the previous run. When called there is no
# PR, so the group falls back to the caller's run id.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The tests and the smoke test are real boots, so the runner needs an
      # emulator. It has no /dev/kvm, so everything runs under TCG. qemu-utils
      # for qemu-img, which makes the images' ext4 disk into qcow2.
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils

      # Honours rust-toolchain.toml, including its components and the
      # x86_64-unknown-none and x86_64-unknown-linux-musl targets. Pull requests
      # only read the cache; a promotion's run saves it.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # There is no workspace: five separate crates with five target
          # directories, plus the vendored bootloader's own, which the nested
          # `cargo install` runs fill with a rebuilt `core` for two custom
          # 16-bit and 32-bit targets. Leaving that one out doubles the run.
          cache-workspaces: |
            kernel -> target
            fullkernel -> target
            tools/boot-test -> target
            user/probe -> target
            fs/ext4 -> target
            vendor/bootloader -> target
          cache-save-if: ${{ github.event_name != 'pull_request' }}

      # vendor/ is upstream code with its own style; only what we write.
      - name: Format
        run: |
          for crate in kernel fullkernel tools/boot-test user/probe fs/ext4; do
            echo "::group::$crate"
            (cd "$crate" && cargo fmt --check)
            echo "::endgroup::"
          done

      # `-D warnings` reaches only the crate being linted, so the vendored
      # bootloader and ps2 are checked but not gated — which is what we want,
      # and worth knowing before someone goes looking for why.
      - name: Lint
        run: |
          for crate in kernel fullkernel tools/boot-test user/probe fs/ext4; do
            echo "::group::$crate"
            (cd "$crate" && cargo clippy --all-targets -- -D warnings)
            echo "::endgroup::"
          done

      # busybox, zsh and vim, for tests/shells.rs, from the sources the script pins,
      # kept for as long as the script stays the same; and its downloads for
      # longer. boot-test would build them anyway: here it's a step of its own.
      - uses: actions/cache@v4
        with:
          path: |
            target/userland/root
            target/userland/built
            target/userland/downloads
          key: userland-${{ hashFiles('scripts/userland.sh') }}
          restore-keys: userland-

      - name: Build the userland
        run: scripts/userland.sh

      # GCC, for tests/toolchain.rs and the images' disk, the same way. It
      # takes an hour here the first time, so it's saved as soon as it's
      # built rather than at the end, which a failing test would skip.
      - uses: actions/cache/restore@v4
        id: toolchain
        with:
          path: |
            target/toolchain/root
            target/toolchain/built
            target/toolchain/downloads
          key: toolchain-${{ hashFiles('scripts/toolchain.sh') }}
          restore-keys: toolchain-

      - name: Build the toolchain
        run: scripts/toolchain.sh

      - uses: actions/cache/save@v4
        if: steps.toolchain.outputs.cache-hit != 'true'
        with:
          path: |
            target/toolchain/root
            target/toolchain/built
            target/toolchain/downloads
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # Each of these is a kernel: built for x86_64-unknown-none, wrapped in a
      # bootable image by tools/boot-test and run under QEMU, which reports the
      # result by the status it exits with. Each run also gets an ext4 disk
      # from e2fsprogs' mke2fs, and e2fsck checks it afterwards.
      - name: Test
        working-directory: kernel
        run: cargo test

      # The kernel saves only the general registers of a thread that's in it,
      # so it mustn't touch SSE ones: Rust code for this target can't, and C
      # (lwext4) is compiled not to. Optimised, as the images are, is when a
      # compiler would reach for them.
      - name: No SSE in the kernel
        working-directory: kernel
        run: |
          cargo build --release
          if objdump -d target/x86_64-unknown-none/release/simplos | grep -E '%[xyz]mm'; then
            exit 1
          fi

      # The ext4 crate's tests run on the host and are judged by e2fsprogs
      # (mke2fs, e2fsck, debugfs), which the runner image has.
      - name: Test ext4
        working-directory: fs/ext4
        run: cargo test

      - name: Build the images
        run: scripts/build-images.sh

      # Boots both images for real and checks the kernel's own boot banner —
      # the firmware it came up under and the framebuffer mode it settled on —
      # and that it mounts the ext4 disk built beside them.
      - name: Boot
        run: scripts/smoke-test.sh

      # Handy on a pull request that changes the kernel: download and boot it
      # without building the whole thing locally.
      - uses: actions/upload-artifact@v4
        with:
          name: disk-images
          path: |
            dist/*.img
            dist/disk.qcow2
          if-no-files-found: error
          retention-days: 7
