[package]
name = "simplos-os"         # or any other name
version = "0.1.0"
edition = "2024"

[build-dependencies]
bootloader = {git = "https://github.com/rust-osdev/bootloader.git"}
simplos = {path= "../kernel",artifact = "bin", target = "x86_64-unknown-none" }
[dependencies]
# used for UEFI booting in QEMU
ovmf-prebuilt = "0.1.0-alpha.1"

[profile.dev]
opt-level = 0
debug = 2

[profile.dev.build-override]
opt-level = 0
debug = 2

# The kernel is an *artifact build-dependency*, so cargo builds it under
# `build-override`, not under `[profile.release]`. Without this a release build
# still ships an unoptimised kernel — which matters most when the guest CPU is
# an interpreter (TCG, or QEMU compiled to WebAssembly).
[profile.release.build-override]
opt-level = 3
debug = false
[patch.crates-io]
ps2 = { path = "../vendor/ps2" }

# Vendored bootloader, patched for a 1920x1080 framebuffer on both firmware paths.
[patch."https://github.com/rust-osdev/bootloader.git"]
bootloader = { path = "../vendor/bootloader" }
bootloader_api = { path = "../vendor/bootloader/api" }
