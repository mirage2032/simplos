[build]
#rustflags=["-g"]
[target.x86_64-unknown-none]
#rustflags = ["-g"]
[unstable]
bindeps=true

# Link the user program with the rust-lld that ships with the toolchain rather
# than the host's `cc` (rustc's default for Linux targets), so producing a Linux
# binary doesn't depend on the host's C toolchain: macOS's `cc` can't link one.
# Through rustflags because cargo ignores `linker` for artifact dependencies.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "linker=rust-lld"]
