[package]
name = "simplos"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
bootloader = { version = "0.9.29", features = ["map_physical_memory"]}
volatile = "0.2.6"
spin = "0.9.8"
x86_64 = "0.15.1"
uart_16550 = "0.3.2"
pic8259 = "0.11.0"
pc-keyboard = "0.8.0"
[package.metadata.bootimage]
#target = ["x86_64-simplos.json"]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04","-serial","stdio","-device", "ps2-mouse"]
test-success-exit-code = 33
test-timeout = 300
[[test]]
name = "should_panic"
harness = false
[[test]]
name = "stack_overflow"
harness = false
