[package]
name = "simplos"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
bootloader = "0.9.0"
volatile = "0.2.6"
spin = "0.9.8"
x86_64 = "0.15.1"
uart_16550 = "0.3.2"
[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04","-serial","stdio"]
test-success-exit-code = 33
test-timeout = 300
[[test]]
name = "should_panic"
harness = false
[[test]]
name = "stack_overflow"
harness = false
