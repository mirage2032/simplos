[package]
name = "simplos"
version = "0.2.3"
edition = "2024"
license = "GPL-2.0-only"

[profile.dev]
panic = "abort"

# Test kernels boot under emulation, where the BIOS bootloader reads the whole
# file through emulated disk I/O: without debug information or symbols, it's
# half a megabyte where it was 15. Optimised a little, the tests that copy a
# lot take a third of the time, and a rebuild after a change no longer. To step
# through one in a debugger, take `debug` and `strip` out.
[profile.test]
opt-level = 1
debug = false
strip = true

# What the kernel uses, `memcpy` and lwext4 among it, optimised properly: built
# once, as it seldom changes.
[profile.test.package."*"]
opt-level = 2

[profile.release]
panic = "abort"

[dependencies]
bootloader_api = {git = "https://github.com/rust-osdev/bootloader.git"}
spin = "0.10.0"
x86_64 = "0.15.1"
x86 = "0.52.0"
uart_16550 = "0.3.2"
pic8259 = "0.11.0"
pc-keyboard = "0.8.0"
ps2 = "0.2.0"
embedded-graphics = "0.8.1"
linked_list_allocator = "0.10.5"
acpi = "5.2.0"
ext4 = { path = "../fs/ext4" }
[[test]]
name = "should_panic"
harness = false
[[test]]
name = "stack_overflow"
harness = false

[patch.crates-io]
# ps2 0.2.0 (latest release) pins x86_64 ^0.14, which no longer compiles on
# current nightly (unstable `Step` trait gained new required methods).
# Local copy only bumps that dependency to 0.15.
ps2 = { path = "../vendor/ps2" }

# Vendored bootloader, patched for a 1920x1080 framebuffer on both firmware paths.
[patch."https://github.com/rust-osdev/bootloader.git"]
bootloader_api = { path = "../vendor/bootloader/api" }
