[package]
name = "simplos"
version = "0.1.1"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
bootloader_api = {git = "https://github.com/rust-osdev/bootloader.git"}
spin = "0.10.0"
x86_64 = "0.15.1"
x86 = "0.52.0"
uart_16550 = "0.3.2"
pic8259 = "0.11.0"
pc-keyboard = "0.8.0"
x86_rtc = "0.1.1"
ps2 = "0.2.0"
embedded-graphics = "0.8.1"
linked_list_allocator = "0.10.5"
acpi = "5.2.0"
[[test]]
name = "should_panic"
harness = false
[[test]]
name = "stack_overflow"
harness = false

[patch.crates-io]
# ps2 0.2.0 (latest release) pins x86_64 ^0.14, which no longer compiles on
# current nightly (unstable `Step` trait gained new required methods).
# Local copy only bumps that dependency to 0.15.
ps2 = { path = "../vendor/ps2" }

# Vendored bootloader, patched for a 1920x1080 framebuffer on both firmware paths.
[patch."https://github.com/rust-osdev/bootloader.git"]
bootloader_api = { path = "../vendor/bootloader/api" }
