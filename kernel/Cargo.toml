[package]
name = "simplos"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
bootloader_api = {git = "https://github.com/rust-osdev/bootloader.git"}
volatile = "0.6.1"
spin = "0.10.0"
x86_64 = "0.15.1"
x86 = "0.52.0"
uart_16550 = "0.3.2"
pic8259 = "0.11.0"
pc-keyboard = "0.8.0"
bitfield-struct = "0.11.0"
x86_rtc = "0.1.1"
ps2 = "0.2.0"
embedded-graphics = "0.8.1"
embedded_font = "0.1.3"
linked_list_allocator = "0.10.5"
[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]
[[test]]
name = "should_panic"
harness = false
[[test]]
name = "stack_overflow"
harness = false
